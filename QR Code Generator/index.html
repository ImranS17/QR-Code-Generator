<!DOCTYPE html>
<!-- Coding By CodingNepal - youtube.com/codingnepal -->
<html lang="en" dir="ltr">

<head>
  <meta charset="utf-8">
  <title>QR Code Generator | CodingNepal</title>
  <link rel="stylesheet" href="style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
  <div class="wrapper">
    <header>
      <h1>QR Code Generator</h1>
      <p>Fill the form to create QR code</p>
    </header>
    <div class="form" method="post">
      <input type="text" spellcheck="false" id="Name" placeholder="Full Name">
      <input type="email" spellcheck="false" id="Email" placeholder="Email">
      <input type="Tel" spellcheck="false" id="Phone" placeholder="Phone Number">
      <input type="file" id="File" spellcheck="false" name="Upload Image">
      <button>Generate QR Code</button>
    </div>
    <div class="qr-code">
      <img src="" alt="qr-code">
    </div>
  </div>

  <script src="script.js"></script>

</body>

</html>
